<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dự đoán nguy cơ tiểu đường</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🩺 Dự đoán nguy cơ tiểu đường</h1>
      <p class="subtitle">Nhập các chỉ số lâm sàng để nhận đánh giá nguy cơ từ mô hình Random Forest</p>
    </header>

    <form id="predict-form">
      <div class="grid">
        <div class="field">
          <label for="gender">Giới tính</label>
          <select id="gender" required>
            <option value="Female">Nữ</option>
            <option value="Male">Nam</option>
          </select>
        </div>

        <div class="field">
          <label for="age">Tuổi</label>
          <input type="number" id="age" min="0" max="120" step="1" value="45" required />
        </div>

        <div class="field">
          <label for="hypertension">Tăng huyết áp</label>
          <select id="hypertension" required>
            <option value="0">Không</option>
            <option value="1">Có</option>
          </select>
        </div>

        <div class="field">
          <label for="heart_disease">Bệnh tim</label>
          <select id="heart_disease" required>
            <option value="0">Không</option>
            <option value="1">Có</option>
          </select>
        </div>

        <div class="field">
          <label for="smoking_history">Tình trạng hút thuốc</label>
          <select id="smoking_history" required>
            <option value="never">Chưa từng hút</option>
            <option value="current">Đang hút</option>
            <option value="former">Đã từng hút (đã bỏ)</option>
            <option value="not current">Không hút hiện tại</option>
            <option value="ever">Từng hút</option>
            <option value="No Info">Không rõ</option>
          </select>
        </div>

        <div class="field">
          <label for="bmi">BMI</label>
          <input type="number" id="bmi" min="5" max="100" step="0.1" value="27.3" required />
        </div>

        <div class="field">
          <label for="hbA1c_level">HbA1c (%)</label>
          <input type="number" id="hbA1c_level" min="3" max="15" step="0.1" value="6.0" required />
        </div>

        <div class="field">
          <label for="blood_glucose_level">Đường huyết (mg/dL)</label>
          <input type="number" id="blood_glucose_level" min="50" max="400" step="1" value="140" required />
        </div>
      </div>

      <button type="submit" id="submit-btn">Dự đoán</button>
    </form>

    <div id="result" class="result hidden"></div>
    <div id="error" class="error hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
