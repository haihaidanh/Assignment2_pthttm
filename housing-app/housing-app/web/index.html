<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Định giá bất động sản</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🏠 Định giá bất động sản</h1>
      <p class="subtitle">Nhập đặc điểm căn nhà để nhận mức giá ước tính từ mô hình Random Forest</p>
    </header>

    <form id="predict-form">
      <div class="grid">
        <div class="field">
          <label for="city">Tỉnh/Thành phố</label>
          <select id="city" required>
            <option value="">Đang tải danh sách...</option>
          </select>
        </div>

        <div class="field">
          <label for="area_m2">Diện tích (m²)</label>
          <input type="number" id="area_m2" min="6" max="999" step="0.1" value="60" required />
        </div>

        <div class="field">
          <label for="bedrooms">Số phòng ngủ</label>
          <input type="number" id="bedrooms" min="0" max="20" step="1" value="3" required />
        </div>

        <div class="field">
          <label for="bathrooms">Số phòng tắm</label>
          <input type="number" id="bathrooms" min="0" max="20" step="1" value="2" required />
        </div>

        <div class="field">
          <label for="floors">Số tầng</label>
          <input type="number" id="floors" min="0" max="20" step="1" value="3" required />
        </div>

        <div class="field">
          <label for="frontage">Mặt tiền</label>
          <select id="frontage" required>
            <option value="1">Có mặt tiền</option>
            <option value="0">Không có mặt tiền</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submit-btn">Định giá</button>
    </form>

    <div id="result" class="result hidden"></div>
    <div id="error" class="error hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
